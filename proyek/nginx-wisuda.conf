# Konfigurasi Nginx Reverse Proxy untuk Sistem Scan Barcode Wisuda
# Letakkan di /etc/nginx/sites-available/wisuda dan aktifkan di sites-enabled

server {
    listen 80;
    server_name wisuda.kampus-anda.ac.id; # Ganti dengan domain Anda

    # Tingkatkan limit upload jika ada foto wisudawan
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3000; # Port aplikasi Node.js
        proxy_http_version 1.1;

        # Konfigurasi Wajib untuk Socket.io / WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Header identitas klien
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout agar koneksi Socket.io tidak putus
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
